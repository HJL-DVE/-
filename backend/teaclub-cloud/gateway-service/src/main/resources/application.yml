server:
  port: ${SERVER_PORT:9000}

spring:
  application:
    name: gateway-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:TEACLUB}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:TEACLUB}
        file-extension: yaml
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
    gateway:
      discovery:
        locator:
          enabled: false   # 关闭自动路由，使用显式路由避免意外暴露内部接口
      routes:
        # ===== 按服务边界设计，路径保持不变（旧接口兼容）=====
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**,/api/admin/auth/**,/api/admin/system/**,/api/admin/store/**
        - id: member-service
          uri: lb://member-service
          predicates:
            - Path=/api/member/**,/api/admin/member/**
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/product/**,/api/admin/product/**
        - id: wallet-service
          uri: lb://wallet-service
          predicates:
            - Path=/api/wallet/**,/api/admin/wallet/**
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/order/**,/api/admin/order/**
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/payment/**,/api/admin/payment/**
        - id: marketing-service
          uri: lb://marketing-service
          predicates:
            - Path=/api/marketing/**,/api/admin/marketing/**
        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/inventory/**,/api/admin/inventory/**
        - id: report-service
          uri: lb://report-service
          predicates:
            - Path=/api/report/**,/api/admin/report/**
      default-filters:
        - AddRequestHeader=X-Gateway, teaclub-gateway
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6380}
      timeout: 3000ms

teaclub:
  jwt:
    admin-secret: ${JWT_ADMIN_SECRET:}
    member-secret: ${JWT_MEMBER_SECRET:}
    access-token-expire-seconds: 7200
    issuer: teaclub
  security:
    internal-token: ${INTERNAL_TOKEN:teaclub-internal-default-token}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.teaclub.cloud: DEBUG
    org.springframework.cloud.gateway: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-}] %logger{36} - %msg%n"
