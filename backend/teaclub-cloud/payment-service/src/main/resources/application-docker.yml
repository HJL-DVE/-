# ======
# 容器环境配置（profile=docker）
# 依赖容器内的 nacos / redis / rabbitmq / mysql
# ======
spring:
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:nacos:8848}
        group: ${NACOS_GROUP:TEACLUB}
      config:
        enabled: true
        import-check:
          enabled: false
        server-addr: ${NACOS_ADDR:nacos:8848}
        group: ${NACOS_GROUP:TEACLUB}
        file-extension: yaml
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:payment_db}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:tc_payment}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:teaclub}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VHOST:/teaclub}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms

logging:
  level:
    root: INFO
    com.teaclub.cloud: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-}] %logger{36} - %msg%n"

teaclub:
  jwt:
    admin-secret: ${JWT_ADMIN_SECRET:}
    member-secret: ${JWT_MEMBER_SECRET:}
    access-token-expire-seconds: 7200
    issuer: teaclub
  security:
    internal-token: ${INTERNAL_TOKEN:teaclub-internal-default-token}
    dev-token-endpoint-enabled: ${DEV_TOKEN_ENDPOINT:false}

  # ===== 支付渠道配置 =====
  # provider=mock      课程设计使用，支付单 provider 恒为 MOCK
  # provider=wechat-v3 真实微信支付 API v3（需商户资质，本项目不启用）
  payment:
    provider: ${PAYMENT_PROVIDER:mock}
    wechat:
      merchant-id: ${WX_MERCHANT_ID:}
      merchant-serial-no: ${WX_MERCHANT_SERIAL_NO:}
      api-v3-key: ${WX_API_V3_KEY:}
      private-key-path: ${WX_PRIVATE_KEY_PATH:}
      app-id: ${WX_APP_ID:}
      notify-url: ${WX_NOTIFY_URL:}
      refund-notify-url: ${WX_REFUND_NOTIFY_URL:}
      platform-cert-path: ${WX_PLATFORM_CERT_PATH:}
    # Mock 渠道通知身份校验：期望值来自配置而非真实商户资质，
    # 但 AppID 比对 / 商户号比对 / 签名校验三条规则真实生效。
    mock:
      expected-app-id: ${PAYMENT_MOCK_APP_ID:mock-appid}
      expected-mch-id: ${PAYMENT_MOCK_MCH_ID:mock-mchid}
      sign-secret: ${PAYMENT_MOCK_SIGN_SECRET:mock-sign-secret}
      # 严格模式：要求通知必须携带 appId/mchId/sign，缺一即拒
      enforce-notify-check: ${PAYMENT_MOCK_ENFORCE:false}
