# ============================================================
# 鐎圭懓娅掗悳顖氼暔闁板秶鐤嗛敍鍧ofile=docker閿?# 娓氭繆绂嗙€圭懓娅掗崘鍛畱 nacos / redis / rabbitmq / mysql
# ============================================================
spring:
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:nacos:8848}
        group: ${NACOS_GROUP:TEACLUB}
      config:
        enabled: true
        import-check:
          enabled: false
        server-addr: ${NACOS_ADDR:nacos:8848}
        group: ${NACOS_GROUP:TEACLUB}
        file-extension: yaml
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:iam_db}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:tc_auth}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:teaclub}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VHOST:/teaclub}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
        prefetch: 10
        retry:
          enabled: true
          max-attempts: 1
          initial-interval: 1000ms

logging:
  level:
    root: INFO
    com.teaclub.cloud: INFO
    org.springframework.cloud.gateway: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-}] %logger{36} - %msg%n"

teaclub:
  jwt:
    admin-secret: ${JWT_ADMIN_SECRET:}
    member-secret: ${JWT_MEMBER_SECRET:}
    access-token-expire-seconds: 7200
    issuer: teaclub
  security:
    internal-token: ${INTERNAL_TOKEN:teaclub-internal-default-token}
    # 娴犲懎顔愰崳銊ㄤ粓鐠嬪啯妞傚鈧崥顖涙拱閸﹂鎶ら悧宀€顏悙鐧哥礄閻㈢喍楠囬悳顖氼暔娑撳秷顔曠純顔款嚉閸欐﹢鍣洪敍?    dev-token-endpoint-enabled: ${DEV_TOKEN_ENDPOINT:false}
