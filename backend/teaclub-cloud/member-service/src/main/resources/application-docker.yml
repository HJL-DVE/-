# ============================================================
# 閻庡湱鎳撳▍鎺楁偝椤栨凹鏆旈梺鏉跨Ф閻ゅ棝鏁嶉崸顪竜file=docker闁?# 濞撴碍绻嗙粋鍡欌偓鍦嚀濞呮帡宕橀崨顖涚暠 nacos / redis / rabbitmq / mysql
# ============================================================
spring:
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:nacos:8848}
        group: ${NACOS_GROUP:TEACLUB}
      config:
        enabled: true
        import-check:
          enabled: false
        server-addr: ${NACOS_ADDR:nacos:8848}
        group: ${NACOS_GROUP:TEACLUB}
        file-extension: yaml
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:member_db}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:tc_member}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:teaclub}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VHOST:/teaclub}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
        prefetch: 10
        retry:
          enabled: true
          max-attempts: 1
          initial-interval: 1000ms

logging:
  level:
    root: INFO
    com.teaclub.cloud: INFO
    org.springframework.cloud.gateway: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-}] %logger{36} - %msg%n"

teaclub:
  messaging:
    dlq-replay-enabled: true
    dlq-queues: teaclub.member.order-paid.queue.dlq
    dlq-replay-ms: 15000
    dlq-replay-initial-delay-ms: 15000
    dlq-replay-batch: 20
    dlq-replay-max-retry: 5

  jwt:
    admin-secret: ${JWT_ADMIN_SECRET:}
    member-secret: ${JWT_MEMBER_SECRET:}
    access-token-expire-seconds: 7200
    issuer: teaclub
  security:
    internal-token: ${INTERNAL_TOKEN:teaclub-internal-default-token}
    # 濞寸姴鎳庨鎰板闯閵娿劋绮撻悹瀣暞濡炲倸顕ｉ埀顒勫触椤栨稒鎷遍柛锕傤暒閹躲倝鎮у畝鈧顒勬倷閻у摜绀勯柣銏㈠枍妤犲洭鎮抽姘兼殧濞戞挸绉烽鏇犵磾椤旀鍤夐柛娆愶耿閸ｆ椽鏁?    dev-token-endpoint-enabled: ${DEV_TOKEN_ENDPOINT:false}
