# ============================================================
# 开发环境配置（Nacos）
# dataId: teaclub-dev.yaml
# group : TEACLUB
# ============================================================

spring:
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai

logging:
  level:
    com.teaclub.cloud: DEBUG
    org.springframework.cloud: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
