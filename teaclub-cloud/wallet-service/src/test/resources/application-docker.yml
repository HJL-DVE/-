# ============================================================
# 测试环境配置（wallet-service 测试）
# 连容器 MySQL（3307），wallet_db 由服务启动时 Flyway 建好
# Flyway 在测试中关闭，避免测试期间改表
# ============================================================
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3307}/${DB_NAME:wallet_db}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:tc_wallet}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 30000
  flyway:
    enabled: false
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6380}
      timeout: 3000ms
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:teaclub}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VHOST:/teaclub}
    listener:
      simple:
        auto-startup: false

teaclub:
  jwt:
    admin-secret: ZGV2LWFkbWluLXNlY3JldC1kby1ub3QtdXNlLWluLXByb2R1Y3Rpb24tMDE=
    member-secret: ZGV2LW1lbWJlci1zZWNyZXQtZG8tbm90LXVzZS1pbi1wcm9kdWN0aW9uLTAy
  security:
    internal-token: ${INTERNAL_TOKEN:teaclub-internal-default-token}
  feign:
    connect-timeout: 3000
    read-timeout: 8000
    default-retry: 0

management:
  health:
    rabbit: { enabled: false }
    db: { enabled: false }
    redis: { enabled: false }

logging:
  level:
    root: WARN
    com.teaclub.cloud: INFO
