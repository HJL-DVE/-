# ============================================================
# TeaClub Web 管理后台 - Nginx 站点配置
#
# 部署形态：同源。浏览器只访问本 Nginx（80），
#   /            -> Vue 静态资源（history 路由回退 index.html）
#   /api/...     -> 反代到 gateway-service:9000（同一 docker 网络内按服务名解析）
#
# 这样生产环境 VITE_API_BASE_URL 必须留空（走相对路径），
# 前端不会硬编码任何服务端口，也不需要 CORS。
# ============================================================

server {
    listen       80;
    server_name  _;

    # 商品图片原图直传：单请求上限 12MB（业务层校验 10MB，留 2MB 给 multipart 边界与表单字段）
    client_max_body_size 12m;

    root  /usr/share/nginx/html;
    index index.html;

    # 静态资源长缓存（Vite 产物带内容 hash，可安全长缓存）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    # history 路由回退：刷新 /member/detail/12 这类深链必须落到 index.html，
    # 否则 Nginx 会去找不存在的文件返回 404。
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ------------------------------------------------------------------
    # API 反代到网关。保留原始 Host 与真实 IP，网关按需记录。
    # 注意：这里不要写 rewrite，网关路由是按完整 /api/... 前缀匹配的。
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass         http://gateway-service:9000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 支付单轮询、报表等长请求，避免网关默认 60s 断连
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # 健康检查（供容器 healthcheck 使用，不暴露业务信息）
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # 压缩
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/json application/javascript
                      application/x-javascript text/xml application/xml image/svg+xml;

    # 基础安全头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;
}
